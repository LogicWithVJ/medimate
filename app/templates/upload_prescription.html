{% extends "base.html" %}
{% block content %}
<h3>Upload Prescription</h3>
<form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
        <label class="form-label">Prescription Image or PDF</label>
        <input type="file" name="prescription_file" class="form-control" accept=".png,.jpg,.jpeg,.pdf" required>
        <div class="form-text">Accepted formats: PNG, JPG, PDF. Max size: 10 MB.</div>
    </div>
    <button type="submit" class="btn btn-primary">Upload</button>
</form>
<p class="mt-3"><a href="{{ url_for('prescriptions.my_prescriptions') }}">View my prescriptions</a></p>
{% endblock %}
